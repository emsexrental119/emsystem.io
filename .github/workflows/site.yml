name: Publish site with current portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate search pages from published CMS only
        run: |
          node cms/scripts/prepare-seo.mjs
          node cms/scripts/prepare-works.mjs
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml CNAME _site/
          cp -R assets images admin services works assembly contact _site/
          touch _site/.nojekyll
      - name: Wait for the existing branch deployment
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 20
              });
              const branchBuild = data.workflow_runs.find(run => run.path === 'dynamic/pages/pages-build-deployment');
              if (branchBuild?.status === 'completed') {
                if (branchBuild.conclusion !== 'success') throw new Error('Branch deployment failed');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Branch deployment did not finish');
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
