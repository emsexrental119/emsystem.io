name: Publish site with current portfolio
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate search pages from published CMS only
        run: |
          node cms/scripts/prepare-seo.mjs
          node cms/scripts/prepare-works.mjs
          mkdir _site
          cp index.html 404.html robots.txt sitemap.xml CNAME _site/
          cp -R assets images admin services works assembly contact _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
