<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>패브릭 암막 재고 · EMSYSTEM</title><link rel="stylesheet" href="/stock/style.css"><script src="/stock/app.js" defer></script></head>
<body><header><a class="brand" href="https://emsystem.co.kr/">EMSYSTEM</a><span>직원 공유 · 조회 전용</span></header>
<main><div class="heading"><div><p class="eyebrow">패브릭 암막</p><h1>사이즈별 재고</h1><p class="muted">창고에 보관 중인 사이즈와 수량을 확인하세요.</p></div><button id="refresh">새로고침</button></div>
<p id="status" role="status">재고를 불러오고 있습니다.</p>
<div id="content" hidden><section class="summary"><div><span>전체 보유 수량</span><strong id="total"></strong></div><div><span>등록 사이즈</span><strong id="count"></strong></div><div><span>최근 수정</span><b id="updated"></b></div></section>

<section class="toolbar"><label>사이즈 검색<input id="search" type="search" placeholder="예: 970 또는 970×3000"></label><span id="matched"></span></section>
<div class="table-wrap"><table><thead><tr><th>사이즈 (mm)</th><th>창고수량</th><th>비고</th><th>출고</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>해당하는 사이즈가 없습니다.</p>
<p class="footnote">조회 전용 화면입니다. 수정이 필요하면 관리자에게 요청해 주세요.</p></div>
<dialog id="edit-dialog"><form id="edit-form"><h2 id="edit-title"></h2><div class="fields"><label>가로 (mm)<input name="width" type="number" min="1" max="1000000" step="1" required></label><label>세로 (mm)<input name="height" type="number" min="1" max="1000000" step="1" required></label></div><label>창고수량 (개)<input name="quantity" type="number" min="0" max="1000000" step="1" required></label><label>비고<textarea name="note" maxlength="500" rows="3"></textarea></label><p id="edit-error" role="alert"></p><div class="actions"><button type="button" id="cancel">취소</button><button class="primary">저장</button></div></form></dialog>
<dialog id="move-dialog"><form id="move-form"><h2 id="move-title"></h2><p id="move-current"></p><label>수량 (개)<input name="amount" type="number" min="1" max="1000000" step="1" required></label><p id="move-error" role="alert"></p><div class="actions"><button type="button" id="move-cancel">취소</button><button class="primary">반영</button></div></form></dialog>
<dialog id="shipment-dialog"><form id="shipment-form"><h2 id="shipment-title">출고 수량 변경</h2><p id="shipment-current"></p><label>누적 출고 (개)<input name="total" type="number" min="0" max="1000000" step="1" required></label><p class="muted">늘린 만큼 창고수량에서 차감됩니다. 출고 수량을 줄이면 차이만큼 창고수량이 복원됩니다.</p><p id="shipment-error" role="alert"></p><div class="actions"><button type="button" id="shipment-cancel">취소</button><button class="primary">저장</button></div></form></dialog></main></body></html>
