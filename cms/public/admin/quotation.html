<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>견적서 작성 · EMSYSTEM</title><link rel="stylesheet" href="/stock/style.css"><link rel="stylesheet" href="/admin/quotation.css"><script src="/admin/quotation.js" defer></script></head>
<body><header><a class="brand" href="/admin/">EMSYSTEM</a><span>관리자 · 견적서 작성</span><a href="/admin/schedule.html">일정 관리</a><a href="/admin/">홈페이지 관리</a></header>
<main><div class="heading"><div><p class="eyebrow">장치업체 견적서</p><h1>견적서 작성</h1><p class="muted">회사 양식으로 작성하고 엑셀 파일을 내려받으세요.</p></div></div><p id="status" role="status">관리자 권한을 확인하고 있습니다.</p>
<form id="quote-form" hidden>
<section class="quote-panel"><h2>견적 정보</h2><div class="quote-fields">
<label>견적일<input name="date" type="date" required min="2000-01-01" max="2099-12-31"></label>
<label>업체명<input name="customer" maxlength="80" required placeholder="견적을 받는 업체"></label>
<label>공사명<input name="project" maxlength="100"></label>
<label>기간<input name="period" maxlength="80" placeholder="예: 2026.10.8–2026.10.16"></label>
<label>연락처<input name="contact" maxlength="80" type="tel"></label>
<label>담당자<input name="person" maxlength="80"></label>
<label>이메일<input name="email" maxlength="120" type="email"></label>
</div></section>
<section class="quote-panel"><div class="heading"><h2>견적 품목</h2><button type="button" id="add-item">＋ 품목 추가</button></div><p class="muted">단가는 부가세 별도 금액입니다. 품목 금액과 부가세 10%를 자동 계산합니다.</p>
<div id="items"></div></section>
<section class="quote-totals"><div><span>공급가액</span><strong id="subtotal">0원</strong></div><div><span>부가세 10%</span><strong id="vat">0원</strong></div><div><span>합계 · VAT 포함</span><strong id="total">0원</strong></div></section>
<p class="footnote">작성 내용은 서버에 저장되지 않습니다. 작업을 마치면 엑셀로 내려받아 보관해 주세요. 회사 정보와 하단 안내문은 기존 양식대로 들어갑니다.</p>
<div class="quote-actions"><button type="submit" class="primary" id="download">엑셀 다운로드 (.xlsx)</button></div>
</form></main></body></html>
